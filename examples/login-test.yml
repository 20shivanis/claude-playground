# Example: Login, select from dropdown, click a button
browser: chromium
slowMo: 500

steps:
  - action: navigate
    url: https://www.te.com/commerce/isd/action/visd_agreement_list

  - action: login
    usernameSelector: "#USER"
    passwordSelector: "#PASSWORD"
    submitSelector: "#signInButton"
    username: YOUR_USERNAME
    password: YOUR_PASSWORD
    waitForSelector: ".dashboard"   # wait for this after login
    timeout: 30000

  - action: wait
    ms: 3000                        # pause 3 seconds

  - action: select
    selector: "#country-dropdown"
    label: "United States"          # can also use: value or index

  - action: click
    selector: "button#submit-form"

  - action: wait
    selector: ".success-message"
    state: visible

  - action: assertText
    selector: ".success-message"
    contains: "Submitted successfully"

  - action: screenshot
    path: screenshots/after-submit.png
