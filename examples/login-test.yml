browser: chromium
slowMo: 500

scenarios:
  - name: "Scenario 1 - Login and select agreement"
    steps:
      - action: navigate
        url: https://www.te.com/commerce/isd/action/visd_agreement_list

      - action: login
        usernameSelector: "#USER"
        passwordSelector: "#PASSWORD"
        submitSelector: "#signInButton"
        username: YOUR_USERNAME
        password: YOUR_PASSWORD
        waitForSelector: ".dashboard"   # update to a selector visible after login
        timeout: 60000

      - action: waitForValue
        selector: "#TEFilterSelectBox"
        value: "182287 (TESOG(EMEA))"
        timeout: 120000   # wait up to 2 minutes for slow startups
        interval: 500     # check every 500ms

      - action: select
        selector: "#country-dropdown"   # update with real selector
        label: "United States"          # update with real value

      - action: click
        selector: "button#submit-form"  # update with real selector

      - action: wait
        selector: ".success-message"    # update with real selector
        state: visible
        timeout: 30000

      - action: screenshot
        path: screenshots/scenario1.png

  - name: "Scenario 2 - Another flow"
    steps:
      - action: navigate
        url: https://www.te.com/commerce/isd/action/visd_agreement_list

      - action: login
        usernameSelector: "#USER"
        passwordSelector: "#PASSWORD"
        submitSelector: "#signInButton"
        username: YOUR_USERNAME
        password: YOUR_PASSWORD
        waitForSelector: ".dashboard"   # update to a selector visible after login
        timeout: 60000

      - action: wait
        ms: 3000

      # add more steps for scenario 2...

      - action: screenshot
        path: screenshots/scenario2.png
